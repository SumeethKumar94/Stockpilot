# Optional: run PostgreSQL in Docker instead of installing it locally.
#   docker compose up -d
# On first start this creates inventory_user, inventory_db and inventory_test_db
# by running database/setup.sql. Then apply the tables with `npm run db:init`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
      - ./database/setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  inventory_pgdata:
