<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StockPilot · Inventory Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before Angular boots to avoid a flash of the wrong theme.
    try {
      var r = document.documentElement;
      r.setAttribute('data-theme', localStorage.getItem('sp-mode') || 'light');
      r.setAttribute('data-accent', localStorage.getItem('sp-accent') || 'indigo');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
